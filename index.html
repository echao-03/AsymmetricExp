<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js VR Base Template</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="app">
        <div id="ui-overlay">
            <div class="quadrant" id="map-quadrant">
                <div class="quadrant-label">Map</div>
            </div>
            <div class="quadrant" id="camera-quadrant">
                <div class="quadrant-label">Camera</div>
            </div>
            <div class="quadrant" id="utilities-quadrant">
                <div class="quadrant-label">Utilities</div>
                <div class="utilities-row">
                    <div class="utility-card" id="keypad-button">Keypad</div>
                    <div class="utility-card" id="handbook-button">Handbook</div>
                    <div class="vertical-utility-container">
                        <div class="utility-button" id="hack-button">Hack</div>
                        <div class="utility-button" id="scan-button">Scan</div>
                        <div class="camera-controls">
                            <div class="camera-button" id="prev-button">Prev</div>
                            <div class="camera-button" id="reset-button">Reset</div>
                            <div class="camera-button" id="next-button">Next</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="quadrant" id="description-quadrant">
                <div class="quadrant-label">Description</div>
                <div class="description-container">
                    <p class="description-text">Hacker can only see the room player is in</p>
                    <p class="description-text">Flip cameras using the buttons in the utilities section</p>
                    <p class="description-text">You have the ability to unlock and hack items in the VR world</p>
                    <p class="description-text">ADD RULES HERE ETC</p>
                </div>
            </div>
        </div>
    </div>

    <div class="keypad-popup" id="keypad">
        <div class="close-button" id="keypad-close">X</div>
        <div class="view-bar" id="num-view-bar">ENTER CODE</div>
        <div class="keypad-row">
            <button class="key" id="1">1</button>
            <button class="key" id="2">2</button>
            <button class="key" id="3">3</button>
        </div>
        <div class="keypad-row">
            <button class="key" id="4">4</button>
            <button class="key" id="5">5</button>
            <button class="key" id="6">6</button>
        </div>
        <div class="keypad-row">
            <button class="key" id="7">7</button>
            <button class="key" id="8">8</button>
            <button class="key" id="9">9</button>
        </div>
        <div class="keypad-row">
            <button class="key" id="clear-button">Clear</button>
            <button class="key" id="0">0</button>
            <button class="key" id="accept-button">Accept</button>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
